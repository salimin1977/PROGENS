name: PROGENS Build Validation
on:
  push:
    branches: ['main', 'phase-2-data-engine', 'phase-3-supabase-provider', 'feat/phase4-complete']
  pull_request:
    branches: ['main', 'phase-3-supabase-provider', 'feat/phase4-command-engine', 'feat/phase4-bottleneck-engine']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run build
      - run: npm run lint
